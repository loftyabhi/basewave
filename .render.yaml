# .render.yaml
services:
  - type: web
    name: basewave-app
    env: php

    buildCommand: |
      apt-get update && apt-get install -y nodejs npm
      npm ci
      composer install --no-dev --optimize-autoloader
      npm run build

    startCommand: |
      php artisan migrate --force
      php artisan serve --host 0.0.0.0 --port $PORT
