services:
  - type: web
    name: basewave-app
    env: php
    plan: free
    envVars:
      - key: PHP_VERSION
        value: 8.2
      - key: NODE_VERSION
        value: 22.11.0
    buildCommand: |
      npm ci
      composer install --no-dev --optimize-autoloader
      npm run build
    startCommand: |
      php artisan migrate --force
      php artisan serve --host=0.0.0.0 --port=$PORT
