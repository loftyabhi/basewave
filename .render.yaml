# .render.yaml
services:
  - type: web
    name: basewave
    env: docker
    plan: free
    branch: main
    region: oregon
    autoDeploy: true
    healthCheckPath: /healthz

    # Render will use your Dockerfile automatically
    buildCommand: "" # leave blank since Dockerfile handles build
    startCommand: "" # leave blank too (Dockerfile CMD runs Apache)

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://basewavebeta.sarkaritool.com
      - key: APP_KEY
        sync: false
      - key: COINCAP_API_KEY
        sync: false

      # PostgreSQL settings (connect your Render PostgreSQL DB)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: basewave-db
          property: host
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        fromDatabase:
          name: basewave-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: basewave-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: basewave-db
          property: password
